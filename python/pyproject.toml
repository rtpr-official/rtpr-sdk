[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtpr"
version = "0.2.0"
description = "Official RTPR SDK for saved-rule alerts and exact raw article bytes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "RTPR", email = "support@rtpr.io" },
]
keywords = [
    "rtpr",
    "press-releases",
    "real-time",
    "saved-rules",
    "alerts",
    "raw-bytes",
    "websocket",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0,<1",
    "websockets>=12.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10,<2",
    "respx>=0.21",
    "build>=1.2",
]

[project.urls]
Homepage = "https://rtpr.io"
Documentation = "https://rtpr.io/docs"
Repository = "https://github.com/rtpr-official/rtpr-sdk"
Issues = "https://github.com/rtpr-official/rtpr-sdk/issues"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "tests"]
